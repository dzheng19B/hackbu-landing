<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicons: the bearcat mark, from brand-source/icon.png via
      `npm run images`. Two rungs because the mark is line art whose strokes are
      3.4% of its height — at 32px they land just above one device pixel, so a
      hi-dpi tab wants the 64 rather than a downscale of it.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />

    <!--
      brand-source/icon_discord.png — the bearcat on its pale green tile — is an
      app-tile asset, so it ships in the two places that ask for one and nowhere
      in the page. Its tile colour is deliberately absent from the stylesheet.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      LCP preload for the campus illustration.

      The hero <img> lives inside the React bundle, so without this the browser
      cannot discover it until the module graph has parsed and the app has
      mounted. `imagesrcset`/`imagesizes` are identical to the <picture>
      sources in src/components/Hero.tsx (via src/lib/images.ts) after srcset
      whitespace normalisation (and byte-identical in the built HTML, which is
      what the browser parses), so the preload and the element resolve to the
      same URL and the image is fetched once.

      `type="image/avif"` gates the hint on AVIF support, which is the same
      condition that decides whether <picture> picks the AVIF <source> — so a
      browser without it skips the preload rather than warming the wrong file,
      and still gets the WebP source normally. `href` is deliberately omitted:
      with `imagesrcset` present it is redundant, and a stale `href` is the
      usual way a preload ends up double-fetching.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="
        /artwork/campus/Campus-640.avif 640w,
        /artwork/campus/Campus-960.avif 960w,
        /artwork/campus/Campus-1280.avif 1280w,
        /artwork/campus/Campus-1672.avif 1672w,
        /artwork/campus/Campus-2508.avif 2508w,
        /artwork/campus/Campus-3344.avif 3344w,
        /artwork/campus/Campus-5016.avif 5016w,
        /artwork/campus/Campus-6688.avif 6688w
      "
      imagesizes="((pointer: coarse) and (max-width: 767px)) 1114px, ((pointer: coarse) and (max-height: 500px)) 1114px, (min-aspect-ratio: 1672/941) 300vw, 533.05vh"
    />
    <meta
      name="description"
      content="HackBU — the student tech club at Binghamton University. No experience required."
    />

    <!--
      Social preview. The four properties ogp.me calls basic metadata are all
      declared: og:title, og:type, og:image and og:url.

      og:image and og:url have to be absolute URLs — scrapers do not resolve a
      relative one against the document — so both carry an origin, and in the
      two content attributes below that origin is a percent-delimited
      SITE_ORIGIN placeholder rather than a domain. The `siteOrigin` plugin in
      vite.config.ts substitutes it at build time from Vercel's
      `VERCEL_PROJECT_PRODUCTION_URL`; a build with no such variable gets the
      fallback literal, which is the preview domain that used to be hardcoded
      here. See README's "Deploying" section: nothing in this file needs
      editing when the custom domain lands.

      (The placeholder is deliberately not spelled out in this comment — the
      substitution is a plain string replace over the whole document and would
      rewrite the prose too.)

      The card is square (732x732 — the tile's own size, not an upscale), which
      is why the Twitter card is `summary` and not `summary_large_image`: the
      large card crops to 1.91:1 and would take the bearcat's ears off.
      og:title repeats <title> verbatim and the description still comes from
      the `description` meta above; neither is duplicated as an og: property.
    -->
    <meta property="og:title" content="HackBU" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/brand/og-image.png" />
    <meta property="og:image:width" content="732" />
    <meta property="og:image:height" content="732" />
    <meta property="og:image:alt" content="The HackBU bearcat logo" />
    <meta name="twitter:card" content="summary" />

    <!--
      Mobile browser chrome takes the page ground rather than the UA default.
      `cloud` (#f7f5ee) from src/index.css's @theme — one of the two literal
      hexes outside it, the other being public/404.html, which cannot reach the
      stylesheet either. There is no dark scheme to vary it against.
    -->
    <meta name="theme-color" content="#f7f5ee" />

    <title>HackBU</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
